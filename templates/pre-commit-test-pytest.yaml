# Fragmento de pruebas Python -- se agrega SOLO si init-repo.ps1 elige (y
# verifica que funcione) pytest como runner. Corre en PRE-PUSH, no en
# pre-commit: las pruebas (y sobre todo un backtest o una suite grande) son
# demasiado lentas para correr en cada commit.
# El comando de la linea "entry:" de aca abajo lo arma init-repo.ps1:
# normalmente "<python> -m pytest -x -q", pero si ya habia un candado de
# pruebas funcionando de una corrida anterior, se reusa ese comando tal
# cual (verbatim) en vez de reconstruirlo -- una regeneracion nunca debe
# reemplazar un candado que ya funciona por otra cosa (ver el propio
# init-repo.ps1, seccion "nunca degradar un candado que funciona"). NOTA:
# no se nombra el token de reemplazo en este comentario a proposito, para
# que una sustitucion por texto no termine corrompiendo esta explicacion
# (bug real que paso: el placeholder aparecia dos veces en este archivo,
# una en la linea "entry:" real y otra aca en el comentario, y una
# sustitucion ingenua reemplazaba las dos).
  - repo: local
    hooks:
      - id: pytest-pre-push
        name: pytest (pre-push)
        entry: <PYTEST_ENTRY_CMD>
        language: system
        pass_filenames: false
        stages: [pre-push]
