# Fragmento de pruebas Node -- se agrega SOLO si init-repo.ps1 detecta un
# script "test" real (no el placeholder por defecto de npm init) en
# package.json. Corre en PRE-PUSH, no en pre-commit, por la misma razon que
# el fragmento de pytest: las pruebas son demasiado lentas para cada commit.
  - repo: local
    hooks:
      - id: npm-test-pre-push
        name: npm test (pre-push)
        entry: npm test
        language: system
        pass_filenames: false
        stages: [pre-push]
