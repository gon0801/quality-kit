# Generado por quality-kit (init-repo.ps1). Corre los mismos candados que
# ya corren en tu maquina (pre-commit) mas las pruebas, en la nube, en cada
# push y en cada pull request -- asi el repo queda protegido aunque alguien
# (vos, otra IA, un colaborador) haga un commit sin pasar por los candados
# locales, o desde una maquina que no los tiene instalados.
#
# CI paralelo (regla 8): la bateria corre COMPLETA en cada push/PR, nunca se
# recorta ni se saltea por tipo de cambio. pytest usa `-n auto` (pytest-xdist)
# por default. Opt-out por repo: QUALITY_KIT_PYTEST_SERIAL=1 al correr
# init-repo.ps1 (suites con estado compartido; el workflow queda en `pytest -q`).
name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-xdist

      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Run pre-commit (todos los candados locales, sobre todo el repo)
        uses: pre-commit/action@v3.0.1

      - name: Run Python tests
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        run: |
          pip install pytest pytest-xdist
          __PYTEST_CMD__
__NODE_IN_QUALITY_JOB__
__NODE_SHARD_JOB__
  gate:
    runs-on: ubuntu-latest
    if: always()
    needs: __GATE_NEEDS__
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Checkers sobre docs o ledger reales
        run: |
          set -e
          found=0
          if [ -d tools ]; then
            for f in tools/check-*.sh tools/check_*.py; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              case "$base" in
                *docs*|*ledger*|*deploy-log*|*context*) ;;
                *) echo "gate: salto $f (no es checker de docs/ledger)"; continue ;;
              esac
              found=1
              echo "gate: corriendo $f"
              case "$f" in
                *.sh) bash "$f" ;;
                *) python3 "$f" ;;
              esac
            done
          fi
          if [ "$found" -eq 0 ]; then
            echo "gate: no hay tools/check-*.sh ni tools/check_*.py -- nada que auditar, sale 0"
          fi
      - name: Todos los jobs de calidad en verde
        env:
__GATE_RESULTS_ENV__
        run: |
          rc=0
          for par in __GATE_RESULTS_FOR__; do
            printf '%s\n' "$par"
            case "$par" in *=success) ;; *) rc=1 ;; esac
          done
          [ "$rc" -eq 0 ] || { echo "gate: algun job de calidad NO quedo en success" >&2; exit 1; }
          echo "gate: OK -- todos en success"
